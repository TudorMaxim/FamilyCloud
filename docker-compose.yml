services:
  frontend:
    ports:
      - "5173:5173"

  backend:
    ports:
      - "5000:5000"
    depends_on:
      - database
      - redis
    command: "flask run --host=0.0.0.0"

  database:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  celery:
    depends_on:
      - backend
      - redis
    command: celery -A app.celery worker --loglevel=info
    volumes:
      - ./backend:/app

  # Monitoring service for Celery tasks
  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
    driver: local
  