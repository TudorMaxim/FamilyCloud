services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL={{ DATABASE_URL }}
    ports:
      - "5432:5432"    
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
